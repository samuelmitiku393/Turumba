services:
  # Main API Server + Notification Scheduler
  - type: web
    name: turumba-server
    env: node
    buildCommand: npm install && npm run db:generate && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Background Bot Worker
  - type: worker
    name: turumba-bot
    env: node
    buildCommand: npm install && npm run db:generate && npm run build --workspace=apps/bot
    startCommand: npm run start --workspace=apps/bot
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        sync: false
